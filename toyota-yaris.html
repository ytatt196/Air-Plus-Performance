
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toyota Yaris 1.5E | Air Plus Performance</title>

<style>
:root {
  --black: #101010;
  --dark: #1c1c1c;
  --gold: #c9a44c;
  --white: #ffffff;
  --grey: #aaaaaa;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--black);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  background: #080808;
  padding: 22px 20px;
  text-align: center;
  border-bottom: 2px solid var(--gold);
}

.logo {
  color: var(--gold);
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 30px 20px 60px;
}

.back-link {
  display: inline-block;
  color: var(--gold);
  text-decoration: none;
  margin-bottom: 25px;
}

h1 {
  color: var(--gold);
  font-size: 32px;
}

.gallery {
  position: relative;
  background: var(--dark);
  border: 1px solid #44391e;
  border-radius: 12px;
  overflow: hidden;
}

.gallery img {
  display: none;
  width: 100%;
  height: 500px;
  object-fit: contain;
  background: #161616;
}

.gallery img.active {
  display: block;
}

.gallery-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.75);
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 12px 16px;
  cursor: pointer;
  font-size: 22px;
  border-radius: 6px;
}

.prev {
  left: 12px;
}

.next {
  right: 12px;
}

.counter {
  text-align: center;
  color: var(--grey);
  padding: 15px;
}

.details {
  background: var(--dark);
  border: 1px solid #44391e;
  border-radius: 12px;
  padding: 25px;
  margin-top: 25px;
}

.details h2 {
  color: var(--gold);
  margin-top: 0;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 15px 0;
  border-bottom: 1px solid #333;
}

.detail-row span:first-child {
  color: var(--grey);
}

.price {
  color: var(--gold);
  font-size: 30px;
  font-weight: bold;
  margin: 25px 0;
}

.button {
  display: block;
  background: var(--gold);
  color: var(--black);
  padding: 16px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  border-radius: 7px;
}

.button:hover {
  background: #e4c46d;
}

footer {
  text-align: center;
  padding: 25px;
  background: #080808;
  color: var(--grey);
  border-top: 1px solid #44391e;
}

@media (max-width: 600px) {
  .logo {
    font-size: 18px;
  }

  h1 {
    font-size: 25px;
  }

  .gallery img {
    height: 320px;
  }

  .gallery-button {
    padding: 9px 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">AIR PLUS PERFORMANCE</div>
</header>

<main class="container">

  <a href="index.html" class="back-link">
    &#8592; Back to Our Cars
  </a>

  <h1>TOYOTA YARIS 1.5E</h1>
  <p style="color:#aaa">Year 2022</p>

  <div class="gallery">

    <img
      src="Front Toyota yaris red.jpg"
      alt="Toyota Yaris front view"
      class="active"
    >

    <img
      src="Back Toyota Yaris red.jpg"
      alt="Toyota Yaris rear view"
    >

    <button
      class="gallery-button prev"
      onclick="changePhoto(-1)"
      aria-label="Previous photo">
      &#10094;
    </button>

    <button
      class="gallery-button next"
      onclick="changePhoto(1)"
      aria-label="Next photo">
      &#10095;
    </button>

  </div>

  <div class="counter" id="counter">
    Photo 1 of 2
  </div>

  <div class="details">

    <h2>VEHICLE DETAILS</h2>

    <div class="detail-row">
      <span>Brand</span>
      <strong>Toyota</strong>
    </div>

    <div class="detail-row">
      <span>Model</span>
      <strong>Yaris 1.5E</strong>
    </div>

    <div class="detail-row">
      <span>Year</span>
      <strong>2022</strong>
    </div>

    <div class="detail-row">
      <span>Colour</span>
      <strong>Red</strong>
    </div>

    <div class="price">
      RM58,800
    </div>

    <a
      class="button"
      href="https://wa.me/601111073280?text=Hi%2C%20I%20am%20interested%20in%20Toyota%20Yaris%201.5E%202022"
      target="_blank"
      rel="noopener noreferrer">
      ENQUIRE VIA WHATSAPP
    </a>

  </div>

</main>

<footer>
  <p>Air Plus Performance</p>
  <p>Bank Loan | Loan Kedai | Sewa</p>
  <p>&copy; 2026 Air Plus Performance</p>
</footer>

<script>
let currentPhoto = 0;

const photos = document.querySelectorAll(
  ".gallery img"
);

function changePhoto(direction) {
  photos[currentPhoto].classList.remove("active");

  currentPhoto =
    (currentPhoto + direction + photos.length)
    % photos.length;

  photos[currentPhoto].classList.add("active");

  document.getElementById("counter").textContent =
    "Photo " + (currentPhoto + 1) +
    " of " + photos.length;
}
</script>

</body>
</html>
