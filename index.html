
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Plus Performance | Used Cars</title>

<style>
:root {
  --black: #101010;
  --dark: #1c1c1c;
  --gold: #c9a44c;
  --white: #ffffff;
  --grey: #aaaaaa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--black);
  color: var(--white);
}

header {
  padding: 22px;
  background: #080808;
  border-bottom: 2px solid var(--gold);
  text-align: center;
}


.logo {
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo img {
  width: 100%;
  max-width: 300px;
  height: auto;
  display: block;
}

  .navbar {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 22px;
  margin-top: 18px;
}

.navbar a {
  color: #ffffff;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  transition: color 0.2s;
}

.navbar a:hover {
  color: var(--gold);
}

@media (max-width: 600px) {
  .navbar {
    gap: 12px;
  }

  .navbar a {
    font-size: 12px;
  }
}

.hero {
  padding: 70px 20px;
  text-align: center;
  background: linear-gradient(135deg,
    #111111, #30291c, #111111);
}

.hero h1 {
  color: var(--gold);
  font-size: 40px;
}

.hero p {
  color: #cccccc;
  line-height: 1.7;
}

.services {
  color: var(--gold);
  margin: 25px 0;
  font-weight: bold;
}


.button {
  display: inline-block;
  padding: 13px 22px;
  background: var(--gold);
  color: #111;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
  transition: 0.2s;
}

.button:hover {
  background: #e4c46d;
  transform: translateY(-2px);
}


.section {
  padding: 55px 20px;
  max-width: 1200px;
  margin: auto;
}

.section h2 {
  text-align: center;
  color: var(--gold);
  font-size: 30px;
}

.car-filters {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 15px;
  margin: 25px 0;
}

.car-filters select {
  width: 100%;
  padding: 13px;
  background: #1c1c1c;
  color: #ffffff;
  border: 1px solid #44391e;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

.car-filters select:focus {
  outline: 1px solid var(--gold);
  border-color: var(--gold);
}

.car-filters .button {
  width: 100%;
  cursor: pointer;
  border: none;
}

.car-filters .reset-button {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}

.car-filters .reset-button:hover {
  background: #30291c;
  color: var(--gold);
}

@media (max-width: 900px) {
  .car-filters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  .car-filters {
    grid-template-columns: 1fr;
  }
}

.search-box {
  width: 100%;
  padding: 15px;
  background: #242424;
  border: 1px solid #6d592b;
  border-radius: 7px;
  color: white;
  font-size: 16px;
  margin: 25px 0;
}


.car-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
}

@media (max-width: 900px) {
    .car-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    .car-grid {
        grid-template-columns: 1fr;
    }
}


.car-card {
  background: var(--dark);
  border: 1px solid #44391e;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.2s;
  display: flex;
  flex-direction: column;
}

.car-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: 0 8px 25px rgba(201, 164, 76, 0.15);
}


.car-photo {
  height: 230px;
  background: #252525;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
}

  
.car-photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}


.car-info {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.car-info h3 {
  margin: 0 0 10px;
}

.car-year {
  color: var(--grey);
}

.car-price {
  color: var(--gold);
  font-size: 24px;
  font-weight: bold;
  margin: 18px 0;
}

.car-info .button {
  margin-top: auto;
  text-align: center;
}
footer {
  padding: 30px;
  text-align: center;
  background: #080808;
  color: var(--grey);
  border-top: 1px solid #44391e;
}

@media(max-width:600px) {
  .hero h1 { font-size: 30px; }
}
</style>
</head>

<body>


<header id="home">
  <div class="logo">
  <img src="air-plus-logo.jpg" alt="Air Plus Performance Logo">
</div>

  <nav class="navbar">
    <a href="index.html">HOME</a>
    <a href="index.html#cars">OUR CARS</a>
    <a href="promotion.html">PROMOTION</a>
    <a href="https://wa.me/60122939186"
       target="_blank"
       rel="noopener noreferrer">CONTACT US</a>
  </nav>
</header>


<section class="hero">
  <h1>FIND YOUR DREAM CAR</h1>
  <p>
    Welcome to Air Plus Performance!
    <br>
    Quality Used Cars at Affordable Prices.
  </p>

  <div class="services">
    BANK LOAN | LOAN KEDAI | SEWA
  </div>

  <a class="button"
     href="https://wa.me/60122939186"
     target="_blank"
     rel="noopener noreferrer">
    WHATSAPP US
  </a>
</section>


<section class="section" id="cars">

  <h2>OUR CARS</h2>


<div class="car-filters">

  <select id="brandFilter">
    <option value="">All Brands</option>
  </select>

  <select id="modelFilter">
    <option value="">All Models</option>
  </select>

  <select id="priceFilter">
    <option value="">Any Price</option>
    <option value="20000">Up to RM20,000</option>
    <option value="30000">Up to RM30,000</option>
    <option value="40000">Up to RM40,000</option>
    <option value="50000">Up to RM50,000</option>
    <option value="60000">Up to RM60,000</option>
    <option value="80000">Up to RM80,000</option>
    <option value="100000">Up to RM100,000</option>
    <option value="150000">Up to RM150,000</option>
    <option value="200000">Up to RM200,000</option>
  </select>

  <button type="button"
          class="button"
          onclick="searchCars()">
    SEARCH CARS
  </button>
  
<button type="button"
        class="button reset-button"
        onclick="resetFilters()">
  RESET FILTERS
</button>


</div>

  <input
    type="text"
    id="search"
    class="search-box"
    placeholder="Search Brand or Model..."
    oninput="searchCars()"
  >

  <div class="car-grid" id="carGrid"></div>

  <p id="noResults"
     style="display:none;text-align:center;color:#aaa">
    No cars found.
  </p>

</section>

<footer>
  <p>Air Plus Performance</p>
  <p>Bank Loan | Loan Kedai | Sewa</p>
  <p>&copy; 2026 Air Plus Performance</p>
</footer>


<script>
// Vehicle listings are loaded from cars.json (the future CMS data source).
const carGrid = document.getElementById("carGrid");
const brandFilter = document.getElementById("brandFilter");
const modelFilter = document.getElementById("modelFilter");
const priceFilter = document.getElementById("priceFilter");
const searchInput = document.getElementById("search");
const noResults = document.getElementById("noResults");

let cars = [];

// Generate a card for each vehicle using the shared data file.
function renderCars() {
  carGrid.replaceChildren();
  const fragment = document.createDocumentFragment();

  cars.forEach(car => {
    const card = document.createElement("div");
    card.className = "car-card";

    const photo = document.createElement("div");
    photo.className = "car-photo";

    if (Array.isArray(car.photos) && car.photos.length > 0 && car.photos[0]) {
      const img = document.createElement("img");
      img.src = car.photos[0];
      img.alt = `${car.brand} ${car.model} ${car.year}`;
      img.loading = "lazy";
      img.onerror = () => {
        photo.textContent = "🚗";
      };
      photo.appendChild(img);
    } else {
      photo.textContent = "🚗";
    }

    const info = document.createElement("div");
    info.className = "car-info";

    const name = document.createElement("h3");
    name.textContent = `${car.brand} ${car.model}`;

    const year = document.createElement("div");
    year.className = "car-year";
    year.textContent = `Year: ${car.year}`;

    const price = document.createElement("div");
    price.className = "car-price";
    price.textContent = `RM${Number(car.price).toLocaleString("en-MY")}`;

    const link = document.createElement("a");
    link.className = "button";
    link.href = `car-details.html?id=${encodeURIComponent(car.id)}`;
    link.textContent = "VIEW DETAILS";

    info.append(name, year, price, link);
    card.append(photo, info);
    fragment.appendChild(card);
  });

  carGrid.appendChild(fragment);
}

// Show only brands and models that exist in current vehicle data.
function populateBrands() {
  const brands = [...new Set(cars.map(car => car.brand).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));

  brandFilter.innerHTML = '<option value="">All Brands</option>';
  brands.forEach(brand => {
    const option = document.createElement("option");
    option.value = brand;
    option.textContent = brand;
    brandFilter.appendChild(option);
  });
}

function updateModels() {
  const brand = brandFilter.value;
  const models = [...new Set(cars
    .filter(car => !brand || car.brand === brand)
    .map(car => car.model)
    .filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));

  modelFilter.innerHTML = '<option value="">All Models</option>';
  models.forEach(model => {
    const option = document.createElement("option");
    option.value = model;
    option.textContent = model;
    modelFilter.appendChild(option);
  });
  modelFilter.disabled = !brand;
  searchCars();
}

function searchCars() {
  const query = searchInput.value.toLowerCase().trim();
  const brand = brandFilter.value;
  const model = modelFilter.value;
  const maxPrice = Number(priceFilter.value);
  const cards = carGrid.querySelectorAll(".car-card");
  let visible = 0;

  cars.forEach((car, index) => {
    const name = `${car.brand} ${car.model}`.toLowerCase();
    const match = name.includes(query)
      && (!brand || car.brand === brand)
      && (!model || car.model === model)
      && (!maxPrice || Number(car.price) <= maxPrice);

    cards[index].style.display = match ? "" : "none";
    if (match) visible++;
  });

  noResults.style.display = visible === 0 ? "block" : "none";
  noResults.textContent = cars.length === 0
    ? "No cars available."
    : "No cars found.";
}

function resetFilters() {
  brandFilter.value = "";
  priceFilter.value = "";
  searchInput.value = "";
  updateModels();
}

brandFilter.addEventListener("change", updateModels);
modelFilter.addEventListener("change", searchCars);
priceFilter.addEventListener("change", searchCars);

// Load the JSON before rendering any cards or filling filter options.
async function loadCars() {
  try {
    const response = await fetch("cars.json", { cache: "no-cache" });
    if (!response.ok) {
      throw new Error(`Failed to load cars.json (HTTP ${response.status})`);
    }

    const data = await response.json();
    if (!data || !Array.isArray(data.cars)) {
      throw new Error("cars.json must contain a cars array");
    }

    cars = data.cars;
    renderCars();
    populateBrands();
    updateModels();
  } catch (error) {
    console.error("Unable to load vehicle data:", error);
    carGrid.replaceChildren();
    noResults.textContent = "Unable to load cars right now. Please try again later.";
    noResults.style.display = "block";
  }
}

loadCars();
</script>


</body>
</html>
