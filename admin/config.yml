
backend:
  name: turbo-github
  turbo_site_id: 0a3b6d92-313a-4da4-b9b2-535f82913bd2
  branch: main

media_folder: "car-images"
public_folder: "car-images"

collections:
  - name: "promotion_management"
    label: "Promotion Management"
    files:
      - name: "promotion"
        label: "Manage Promotion"
        file: "promotion.json"
        format: "json"
        editor:
          preview: false
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Section Background Image", name: "sectionBackgroundImage", widget: "image", required: false }
          - label: "Promotion List"
            name: "promotions"
            widget: "list"
            label_singular: "Promotion"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "Promotion Title", name: "title", widget: "string" }
              - { label: "Promotion Description", name: "description", widget: "text" }
              - { label: "Promotion Image", name: "image", widget: "image", required: false }
          - { label: "Promotion Note", name: "note", widget: "text" }
          - { label: "WhatsApp Button Text", name: "whatsappButtonText", widget: "string" }

  - name: "site_design"
    label: "Website Backgrounds"
    files:
      - name: "backgrounds"
        label: "Manage Website Backgrounds"
        file: "site-design.json"
        format: "json"
        editor:
          preview: false
        fields:
          - { label: "Logo / Header Background (All Pages)", name: "headerBackgroundImage", widget: "image", required: false }
          - { label: "HOME Main Banner Background", name: "homeBackgroundImage", widget: "image", required: false }
          - { label: "OUR CARS Full Background", name: "carsBackgroundImage", widget: "image", required: false }

  # Individual car records
  - name: "individual_cars_test"
    label: "Vehicle Management"
    label_singular: "Car"
    folder: "cars"
    path: "{{slug}}/index"
    media_folder: "photos"
    public_folder: ""
    create: true
    extension: "json"
    format: "json"
    identifier_field: "id"
    slug: "{{slug}}"
    summary: "{{brand}} {{model}}"
    editor:
      preview: false
    fields:
      - { label: "Car ID", name: "id", widget: "string", hint: "Unique ID. Do not change after creating." }
      - { label: "Brand", name: "brand", widget: "string" }
      - { label: "Model", name: "model", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Price (RM)", name: "price", widget: "number", value_type: "int", min: 0 }
      - { label: "Colour", name: "color", widget: "string", required: false }
      - { label: "Mileage (km)", name: "mileage", widget: "number", value_type: "int", min: 0, required: false }
      - label: "Transmission"
        name: "transmission"
        widget: "select"
        required: false
        options:
          - "Automatic"
          - "Manual"
          - "CVT"
          - "DCT"
          - "Other"
      - label: "Car Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Available", value: "available" }
          - { label: "In Preparation", value: "preparation" }
          - { label: "Reserved", value: "reserved" }
          - { label: "Sold", value: "sold" }
      - label: "Car Photos"
        name: "photos"
        widget: "list"
        required: false
        field:
          label: "Photo"
          name: "photo"
          widget: "image"
