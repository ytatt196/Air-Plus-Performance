

backend:
  name: turbo-github
  turbo_site_id: 0a3b6d92-313a-4da4-b9b2-535f82913bd2

media_folder: "car-images"
public_folder: "car-images"

collections:
  - name: "vehicle_management"
    label: "Vehicle Management"
    files:
      - name: "vehicles"
        label: "Manage Cars"
        file: "cars.json"
        format: "json"
        editor:
          preview: false
        fields:
          - name: "cars"
            label: "Car List"
            label_singular: "Car"
            widget: "list"
            collapsed: true
            summary: "{{fields.brand}} {{fields.model}}"
            fields:
              - { label: "Car ID", name: "id", widget: "string", hint: "Unique ID, e.g. toyota-vios-2020. Do not change existing IDs." }
              - { label: "Brand", name: "brand", widget: "string" }
              - { label: "Model", name: "model", widget: "string" }
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Price (RM)", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Colour", name: "color", widget: "string", required: false }
              - { label: "Mileage (km)", name: "mileage", widget: "number", value_type: "int", min: 0, required: false }
              - label: "Transmission"
                name: "transmission"
                widget: "select"
                required: false
                options:
                  - "Automatic"
                  - "Manual"
                  - "CVT"
                  - "DCT"
                  - "Other"
              - label: "Car Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Available", value: "available" }
                  - { label: "Sold", value: "sold" }
                  - { label: "Reserved", value: "reserved" }
              - label: "Car Photos"
                name: "photos"
                widget: "list"
                required: false
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"
