backend:
  name: turbo-github
  turbo_site_id: 0a3b6d92-313a-4da4-b9b2-535f82913bd2

media_folder: "car-images"
public_folder: "car-images"

collections:
  - name: "vehicle_management"
    label: "Vehicle Management"
    files:
      - name: "vehicles"
        label: "Manage Cars"
        file: "cars.json"
        format: "json"
        editor:
          preview: false
        fields:
          - name: "cars"
            label: "Car List"
            label_singular: "Car"
            widget: "list"
            collapsed: true
            summary: "{{fields.brand}} {{fields.model}}"
            fields:
              - label: "Car ID"
                name: "id"
                widget: "string"
                hint: "Unique ID, e.g. toyota-vios-2020. Do not change existing IDs."

              - label: "Brand"
                name: "brand"
                widget: "string"

              - label: "Model"
                name: "model"
                widget: "string"

              - label: "Year"
                name: "year"
                widget: "number"
                value_type: "int"

              - label: "Price (RM)"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0

              - label: "Colour"
                name: "color"
                widget: "string"
                required: false

              - label: "Mileage (km)"
                name: "mileage"
                widget: "number"
                value_type: "int"
                min: 0
                required: false

              - label: "Transmission"
                name: "transmission"
                widget: "select"
                required: false
                options:
                  - "Automatic"
                  - "Manual"
                  - "CVT"
                  - "DCT"
                  - "Other"

              - label: "Car Status"
                name: "status"
                widget: "select"
                options:
                  - label: "Available"
                    value: "available"
                  - label: "Reserved"
                    value: "reserved"
                  - label: "In Preparation"
                    value: "preparation"
                  - label: "Sold"
                    value: "sold"

              - label: "Car Photos"
                name: "photos"
                widget: "list"
                required: false
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"

  - name: "promotion_management"
    label: "Promotion Management"
    files:
      - name: "promotion"
        label: "Manage Promotion"
        file: "promotion.json"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Hero Title"
            name: "heroTitle"
            widget: "string"

          - label: "Hero Subtitle"
            name: "heroSubtitle"
            widget: "text"

          - label: "Section Background Image"
            name: "sectionBackgroundImage"
            widget: "image"
            required: false

          - label: "Promotion List"
            name: "promotions"
            widget: "list"
            label_singular: "Promotion"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "Promotion Title"
                name: "title"
                widget: "string"

              - label: "Promotion Description"
                name: "description"
                widget: "text"

              - label: "Promotion Image"
                name: "image"
                widget: "image"
                required: false

          - label: "Promotion Note"
            name: "note"
            widget: "text"

          - label: "WhatsApp Button Text"
            name: "whatsappButtonText"
            widget: "string"
