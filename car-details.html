<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Details | Air Plus Performance</title>

<style>
:root {
  --black: #101010;
  --dark: #1c1c1c;
  --gold: #c9a44c;
  --grey: #aaaaaa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--black);
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #080808;
  border-bottom: 2px solid var(--gold);
  padding: 22px 20px;
  text-align: center;
}

.logo img {
  width: 100%;
  max-width: 300px;
  height: auto;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 22px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.navbar a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

.navbar a:hover { color: var(--gold); }

.container {
  max-width: 1000px;
  margin: auto;
  padding: 35px 20px 60px;
}

.back-link {
  color: var(--gold);
  text-decoration: none;
}

h1 {
  color: var(--gold);
  margin-top: 25px;
}

.gallery {
  position: relative;
  background: var(--dark);
  border: 1px solid #44391e;
  border-radius: 12px;
  overflow: hidden;
}

.gallery img {
  display: none;
  width: 100%;
  height: 480px;
  object-fit: contain;
}

.gallery img.active { display: block; }

.gallery-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.75);
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 6px;
  cursor: pointer;
  font-size: 22px;
}

.prev { left: 12px; }
.next { right: 12px; }

.counter {
  text-align: center;
  color: var(--grey);
  margin: 15px 0;
}

.details {
  background: var(--dark);
  border: 1px solid #44391e;
  border-radius: 12px;
  padding: 25px;
  margin-top: 25px;
}

.details h2 { color: var(--gold); }

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 14px 0;
  border-bottom: 1px solid #333;
}

.detail-row span:first-child { color: var(--grey); }
.detail-row strong { text-align: right; overflow-wrap: anywhere; }

.price {
  color: var(--gold);
  font-size: 30px;
  font-weight: bold;
  margin: 25px 0;
}

.button {
  display: block;
  background: var(--gold);
  color: #111;
  padding: 16px;
  border-radius: 7px;
  text-decoration: none;
  text-align: center;
  font-weight: bold;
}

.no-photo {
  padding: 90px 20px;
  text-align: center;
  color: var(--grey);
}

footer {
  padding: 30px;
  text-align: center;
  background: #080808;
  color: var(--grey);
  border-top: 1px solid #44391e;
}

@media (max-width: 600px) {
  .navbar { gap: 12px; }
  .navbar a { font-size: 12px; }
  .gallery img { height: 320px; }
  h1 { font-size: 25px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">
    <img src="air-plus-logo.jpg" alt="Air Plus Performance Logo">
  </div>

  <nav class="navbar">
    <a href="index.html">HOME</a>
    <a href="index.html#cars">OUR CARS</a>
    <a href="promotion.html">PROMOTION</a>
    <a href="https://wa.me/60122939186"
       target="_blank"
       rel="noopener noreferrer">CONTACT US</a>
  </nav>
</header>

<main class="container">
  <a class="back-link" href="index.html#cars">
    &#8592; Back to Our Cars
  </a>

  <h1 id="carTitle">Car Details</h1>
  <div class="gallery" id="gallery"></div>
  <div class="counter" id="counter"></div>
  <div class="details" id="details"></div>
</main>

<footer>
  <p>Air Plus Performance</p>
  <p>Bank Loan | Loan Kedai | Sewa</p>
  <p>&copy; 2026 Air Plus Performance</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const carId = params.get("id");

const titleElement = document.getElementById("carTitle");
const gallery = document.getElementById("gallery");
const counter = document.getElementById("counter");
const details = document.getElementById("details");

function showGalleryMessage(message) {
  gallery.replaceChildren();
  const notice = document.createElement("div");
  notice.className = "no-photo";
  notice.textContent = message;
  gallery.appendChild(notice);
  counter.textContent = "";
}

function addDetailRow(label, value) {
  const row = document.createElement("div");
  row.className = "detail-row";
  const name = document.createElement("span");
  name.textContent = label;
  const result = document.createElement("strong");
  result.textContent = String(value);
  row.append(name, result);
  details.appendChild(row);
}

function renderCar(car) {
  details.replaceChildren();
  if (!car) {
    titleElement.textContent = "Car Not Found";
    showGalleryMessage("This car is not available.");
    return;
  }

  const fullName = `${car.brand || ""} ${car.model || ""}`.trim();
  document.title = `${fullName} | Air Plus Performance`;
  titleElement.textContent = fullName;

  const photos = Array.isArray(car.photos)
    ? car.photos.filter(photo => typeof photo === "string" && photo.trim())
    : [];

  if (photos.length === 0) {
    showGalleryMessage("No Photo Available");
  } else {
    gallery.replaceChildren();
    const images = [];
    let currentPhoto = 0;

    function showPhoto(index) {
      images.forEach((img, imageIndex) => {
        img.classList.toggle("active", imageIndex === index);
      });
      currentPhoto = index;
      counter.textContent = `Photo ${currentPhoto + 1} of ${images.length}`;
    }

    function updateGallery() {
      if (images.length === 0) {
        showGalleryMessage("No Photo Available");
        return;
      }
      showPhoto(Math.min(currentPhoto, images.length - 1));
      prev.hidden = images.length <= 1;
      next.hidden = images.length <= 1;
    }

    const prev = document.createElement("button");
    prev.type = "button";
    prev.className = "gallery-button prev";
    prev.textContent = "❮";
    prev.setAttribute("aria-label", "Previous photo");
    prev.onclick = () => showPhoto((currentPhoto - 1 + images.length) % images.length);

    const next = document.createElement("button");
    next.type = "button";
    next.className = "gallery-button next";
    next.textContent = "❯";
    next.setAttribute("aria-label", "Next photo");
    next.onclick = () => showPhoto((currentPhoto + 1) % images.length);

    photos.forEach(photo => {
      const img = document.createElement("img");
      img.alt = fullName;
      img.onerror = () => {
        const index = images.indexOf(img);
        if (index !== -1) {
          images.splice(index, 1);
          img.remove();
          currentPhoto = 0;
          updateGallery();
        }
      };
      images.push(img);
      gallery.appendChild(img);
      img.src = photo;
    });

    gallery.append(prev, next);
    updateGallery();
  }

  const heading = document.createElement("h2");
  heading.textContent = "VEHICLE DETAILS";
  details.appendChild(heading);

  addDetailRow("Brand", car.brand || "Not specified");
  addDetailRow("Model", car.model || "Not specified");
  addDetailRow("Year", car.year ?? "Not specified");
  addDetailRow("Colour", car.color || "Not specified");

  // Optional details are only shown when they have values.
  if (car.mileage !== null && car.mileage !== undefined && car.mileage !== "") {
    const mileage = Number(car.mileage);
    if (Number.isFinite(mileage) && mileage >= 0) {
      addDetailRow("Mileage", `${mileage.toLocaleString("en-MY")} km`);
    }
  }
  if (typeof car.transmission === "string" && car.transmission.trim()) {
    addDetailRow("Transmission", car.transmission.trim());
  }

  const priceElement = document.createElement("div");
  priceElement.className = "price";
  const priceValue = Number(car.price);
  priceElement.textContent = car.price !== null && car.price !== undefined && car.price !== "" &&
    Number.isFinite(priceValue) && priceValue >= 0
    ? `RM${priceValue.toLocaleString("en-MY")}`
    : "Price on request";
  details.appendChild(priceElement);

  const message = encodeURIComponent(
    `Hi, I am interested in ${fullName} ${car.year || ""}`.trim()
  );
  const enquiry = document.createElement("a");
  enquiry.className = "button";
  enquiry.href = `https://wa.me/60122939186?text=${message}`;
  enquiry.target = "_blank";
  enquiry.rel = "noopener noreferrer";
  enquiry.textContent = "ENQUIRE VIA WHATSAPP";
  details.appendChild(enquiry);
}

async function loadCarDetails() {
  if (!carId) {
    renderCar(null);
    return;
  }

  try {
    const response = await fetch("cars.json", { cache: "no-cache" });
    if (!response.ok) {
      throw new Error(`Failed to load cars.json (HTTP ${response.status})`);
    }

    const data = await response.json();
    if (!data || !Array.isArray(data.cars)) {
      throw new Error("cars.json must contain a cars array");
    }

    const car = data.cars.find(item => item && item.id === carId);
    renderCar(car);
  } catch (error) {
    console.error("Unable to load car details:", error);
    titleElement.textContent = "Unable to Load Car Details";
    showGalleryMessage("Unable to load this car right now. Please try again later.");
    details.replaceChildren();
  }
}

loadCarDetails();
</script>
</body>
</html>
